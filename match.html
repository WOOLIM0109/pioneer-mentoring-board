<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>멘토 · 멘티 매칭</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--navy:#1B2A4A;--orange:#F07C1C;--bg:#F3F5F9;--paper:#fff;--ink:#141A2B;--ink2:#5F6880;--line:#D8DEE9;--line2:#ECEFF5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;padding:16px}
.tools{max-width:760px;margin:0 auto 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .st{font-size:13px;color:var(--ink2);margin-right:auto}
.btn{font:inherit;font-size:15px;font-weight:700;padding:10px 18px;border:0;border-radius:6px;background:var(--orange);color:#fff;cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--ink2);border:1px solid var(--line)}
.board{max-width:760px;margin:0 auto;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:32px 36px}
.top{border-bottom:5px solid var(--navy);padding-bottom:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eb{font-size:12px;letter-spacing:.14em;color:var(--orange);font-weight:700}
h1{margin:4px 0 0;font-size:30px;font-weight:900;color:var(--navy)}
.date{font-size:14px;color:var(--ink2);white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;padding:16px 4px;border-bottom:1.5px solid var(--line2)}
.row:last-child{border-bottom:0}
.mentee{font-size:28px;font-weight:900;color:var(--ink)}
.mentee small{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}
.arr{text-align:center;color:var(--line);font-size:26px}
.mentor{font-size:28px;font-weight:900;color:var(--orange)}
.mentor small{display:block;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.08em}
.hd{display:grid;grid-template-columns:1fr 60px 1fr;padding:10px 4px 6px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.1em}
.foot{margin-top:18px;padding-top:12px;border-top:1.5px solid var(--line);font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--ink2)}
@media (max-width:520px){.mentee,.mentor{font-size:22px}.row{grid-template-columns:1fr 36px 1fr}.board{padding:22px 18px}}
</style>
</head>
<body>
<div class="tools">
  <span class="st" id="st">시트에서 불러오는 중…</span>
  <a class="btn ghost" href="./">분담표로</a>
  <button class="btn" id="save" type="button">이미지로 저장</button>
</div>
<div class="board" id="board">
  <div class="top"><div><div class="eb">BNI PIONEER · MENTORING TEAM 9기</div><h1>멘토 · 멘티 매칭</h1></div><div class="date" id="date"></div></div>
  <div class="hd"><span>멘티 (신규 멤버)</span><span></span><span>멘토</span></div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <div class="foot"><span>패스포트 관리 시트의 멘토 칸을 바꾸면 이 장표도 바뀝니다</span><span>멘토링 기간: 입회일부터 7개월</span></div>
</div>
<script>
const SHEET_ID='1fKbObyuJFYBVDQcQu5KQmmHySIuVblZJBxic-7mIr-M';
const SHEET_NAME='시트1';
const MONTHS=7; // 입회 7개월(210일) 이내만 표시
const st=document.getElementById('st'), list=document.getElementById('list');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/\s+/g,'');
document.getElementById('date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})+' 기준';

async function load(){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}&headers=0`;
    const txt=await fetch(url).then(r=>r.text());
    const json=JSON.parse(txt.substring(txt.indexOf('{'),txt.lastIndexOf('}')+1));
    const rows=json.table.rows.map(r=>(r.c||[]).map(c=>c?(c.f!==undefined&&c.v instanceof Object?c.f:c.v):null));
    // 헤더 행 찾기
    const hi=rows.findIndex(r=>r.some(v=>norm(v)==='이름')&&r.some(v=>norm(v)==='멘토'));
    if(hi<0) throw new Error('헤더(이름·멘토)를 찾지 못함');
    const H=rows[hi].map(norm);
    const cName=H.indexOf('이름'), cMentor=H.indexOf('멘토');
    // 가입날짜: 이름 오른쪽에서 날짜값이 들어 있는 첫 열
    const data=rows.slice(hi+1);
    let cJoin=-1; for(let c=cName+1;c<H.length&&cJoin<0;c++){ if(data.some(r=>/^Date\(/.test(String(r[c])))) cJoin=c; }
    if(cJoin<0) throw new Error('가입날짜 열을 찾지 못함');
    const today=new Date(); const cutoff=new Date(today); cutoff.setMonth(cutoff.getMonth()-MONTHS);
    const soon=new Date(today); soon.setDate(soon.getDate()+60);
    const parseDate=v=>{ if(!v) return null; const m=String(v).match(/Date\((\d+),(\d+),(\d+)/); if(m) return new Date(+m[1],+m[2],+m[3]); const d=new Date(String(v).replace(/\./g,'-')); return isNaN(d)?null:d; };
    const items=data.map(r=>({name:norm(r[cName]),mentor:String(r[cMentor]||'').trim(),join:parseDate(r[cJoin])}))
      .filter(x=>x.name&&x.join&&x.join>=cutoff&&x.join<=soon).sort((a,b)=>b.join-a.join);
    if(!items.length){list.innerHTML='<div class="empty">표시할 신규 멤버가 없습니다.</div>';}
    else list.innerHTML=items.map(x=>`<div class="row"><div class="mentee">${esc(x.name)}<small>${x.join.getMonth()+1}/${x.join.getDate()} ${x.join>today?'입회 예정':'입회'}</small></div><div class="arr">→</div><div class="mentor">${x.mentor?esc(x.mentor):'<span style="color:#C0392B;font-size:18px">멘토 미지정</span>'}</div></div>`).join('');
    st.textContent=`시트 기준 ${items.length}명 · 최신`;
  }catch(e){
    console.error(e);
    st.textContent='시트를 읽지 못했습니다';
    list.innerHTML='<div class="empty">시트를 읽지 못했습니다. 시트 공유가 "링크가 있는 모든 사용자"인지 확인해 주세요.</div>';
  }
}
load();
document.getElementById('save').addEventListener('click',async()=>{
  const b=document.getElementById('board'); st.textContent='이미지 만드는 중…';
  const canvas=await html2canvas(b,{scale:2,backgroundColor:'#ffffff'});
  const a=document.createElement('a'); a.download=`멘토멘티_매칭_${new Date().toISOString().slice(0,10)}.png`; a.href=canvas.toDataURL('image/png'); a.click();
  st.textContent='저장됨 · 카톡방에 올리세요';
});
</script>
</body>
</html>
